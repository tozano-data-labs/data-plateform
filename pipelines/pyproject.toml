[project]
name = "data-platform-pipelines"
version = "0.1.0"
description = "Pipelines d'ingestion de la plateforme de données tozano-data-labs"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
